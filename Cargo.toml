[package]
name = "omacctv"
version = "0.1.0"
edition = "2021"
description = "OmaCCTV: native camera multiview for Frigate (live grid, horizontal timeline, two-way audio) for Linux phones"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }
async-channel = "2"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 2
lto = true
strip = true
panic = "abort"
